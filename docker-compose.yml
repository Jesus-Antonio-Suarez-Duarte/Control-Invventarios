version: '3.8'

services:
  # Microservicio de Productos
  productos-api:
    build:
      context: ./productos-api
      dockerfile: Dockerfile
    container_name: productos-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@host.docker.internal:1521:xe
      SPRING_DATASOURCE_USERNAME: JASD
      SPRING_DATASOURCE_PASSWORD: 1234
      API_KEY: secretKey_2025_prod
      JAVA_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - inventario-network
    volumes:
      - ./logs/productos:/app/logs

  # Microservicio de Inventario
  inventario-api:
    build:
      context: ./inventario-api
      dockerfile: Dockerfile
    container_name: inventario-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@host.docker.internal:1521:xe
      SPRING_DATASOURCE_USERNAME: JASD
      SPRING_DATASOURCE_PASSWORD: 1234
      MICROSERVICIO_PRODUCTOS_URL: http://productos-api:8080
      API_KEY: secretKey_2025_prod
      JAVA_OPTS: -Xmx512m -Xms256m
    depends_on:
      - productos-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - inventario-network
    volumes:
      - ./logs/inventario:/app/logs

# Red personalizada
networks:
  inventario-network:
    driver: bridge